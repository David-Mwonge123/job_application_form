<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APPLICATION FORM</title>
  </head>
  <body>
    <h1><strong>JOB APPLICATION FORM</strong></h1>
    <form action="">
      <fieldset>
        <legend><strong>PERSONAL INFORMATION</strong></legend>
        <label for="name">Name:</label>
        <input type="text" name="name" id="name" />
        <label for="dob">Date of Birth:</label>
        <input type="date" name="dob" id="dob" />
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" />
        <label for="address">Address:</label>
        <input type="text" name="address" id="address" />
        <label for="phone number">Phone Number:</label>
        <input type="number" name="phone number" id="phone number" />
        <br /><br />
        <label for="gender">Gender:</label>
        <br />
        <input type="radio" name="gender" id="male" />
        <label for="male">Male</label>
        <br />
        <input type="radio" name="gender" id="female" />
        <label for="female">Female</label>
        <br /><br />
        <label for="country">Country:</label>
        <select name="country" id="country">
          <option value="ke">Kenya</option>
        </select>
        <label for="city">City</label>
        <select name="city" id="city">
          <option value="nb">Nairobi</option>
        </select>
      </fieldset>
      <fieldset>
        <legend><strong>EDUCATION INFORMATION</strong></legend>
        <label for="name">College Name:</label>
        <input type="text" name="name" id="name">
        
        <label for="city">City:</label>
        <input type="text" name="city" id="city">
        <label for="duration">From:</label>
        <input type="text" name="duration" id="duration">
        <label for="duration">To:</label>
        <input type="text" name="duration" id="duration">
        <label for="graduate">Graduate:</label>
        <input type="radio" name="graduate" id="yes">
        <label for="yes">Yes</label>
        <input type="radio" name="graduate" id="no">
        <label for="no">No</label>

      </fieldset>
    </form>
  </body>
</html>
